<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Catálogo de Válvulas Vexbiz</title>
<meta name="description" content="Catálogo digital de válvulas Bray, Ritepro y Dorot — Vexbiz Suministros">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: una diapositiva a la vez, barra superior fija con contador, botones grandes abajo. Pensado para lectura cómoda. */
:root{
  --bg:#F6F8FA; --card:#FFFFFF; --fg:#14202B; --muted:#3E4A56; --line:#C9D3DC;
  --accent:#123E66; --accent-ink:#FFFFFF; --tag:#8A5A00; --photo:#EDF1F5;
  --f-display:'Archivo', 'Arial Narrow', Arial, sans-serif;
  --f-body:'Atkinson Hyperlegible', Verdana, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1720; --card:#16212C; --fg:#EEF2F6; --muted:#B9C4CF; --line:#2E3D4B;
  --accent:#7DB4E8; --accent-ink:#0B1520; --tag:#E6B85C; --photo:#E9EEF3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1720; --card:#16212C; --fg:#EEF2F6; --muted:#B9C4CF; --line:#2E3D4B;
  --accent:#7DB4E8; --accent-ink:#0B1520; --tag:#E6B85C; --photo:#E9EEF3; color-scheme:dark}

html,body{height:100%}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:20px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.app{max-width:1120px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;padding-block:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--fg);padding-bottom:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.06em;color:var(--accent)}
.counter{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
main{flex:1;display:flex}
.slide{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:clamp(20px,4vw,44px);
  display:flex;flex-direction:column;gap:22px;animation:fade .35s ease}
@keyframes fade{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.slide{animation:none}}
.eyebrow{font-size:18px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tag)}
h1,h2{font-family:var(--f-display);font-weight:800;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(40px,7vw,72px)}
h2{font-size:clamp(32px,4.6vw,48px)}
p{margin:0}
.lead{font-size:clamp(20px,2.4vw,26px);color:var(--muted);max-width:40ch}
.big{font-size:clamp(20px,2.2vw,24px);max-width:48ch}

/* producto */
.prod{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(20px,4vw,48px);align-items:center}
.photo{background:var(--photo);border-radius:10px;display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;max-width:100%;overflow:hidden}
.photo img{width:86%;height:86%;object-fit:contain;mix-blend-mode:multiply}
.photo img.cover{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:cover;mix-blend-mode:normal}
.ptext{display:flex;flex-direction:column;gap:18px;min-width:0}
.num{font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--accent)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 18px;font-size:20px;border-top:2px solid var(--line);padding-top:16px}
dt{font-weight:700}
dd{margin:0;color:var(--muted)}

/* portada */
.cover-photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cover-photos .photo{aspect-ratio:4/3}
.brands{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.brands h3{font-family:var(--f-display);font-size:26px;margin:0 0 6px}
.brands p{font-size:18px;color:var(--muted)}

/* índice */
.toc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.toc button{display:flex;gap:14px;align-items:center;text-align:left;width:100%;min-height:58px;padding:10px 16px;
  font:inherit;font-size:19px;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:8px;cursor:pointer}
.toc button:hover{border-color:var(--accent)}
.toc b{font-family:var(--f-display);font-size:22px;color:var(--accent);min-width:34px}

.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 28px;font-size:22px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:14px;align-items:baseline}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--accent);min-width:24px}

nav{display:grid;grid-template-columns:1fr auto 1fr;gap:12px}
nav button{min-height:72px;font:inherit;font-size:24px;font-weight:700;border-radius:10px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:12px;padding:0 20px}
.btn-main{background:var(--accent);color:var(--accent-ink);border:none}
.btn-alt{background:var(--card);color:var(--fg);border:2px solid var(--fg)}
nav button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:4px solid var(--tag);outline-offset:3px}
nav svg{width:28px;height:28px;flex-shrink:0}
.hint{text-align:center;font-size:17px;color:var(--muted)}

@media (max-width:760px){
  body{font-size:18px}
  .prod,.brands,.toc,.steps{grid-template-columns:minmax(0,1fr)}
  .prod .photo{aspect-ratio:4/3}
  .cover-photos{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  nav{grid-template-columns:1fr 1fr}
  nav .btn-alt{grid-column:1 / -1;order:-1;min-height:56px;font-size:20px}
  nav button{font-size:20px}
}
</style>
</head>
<body>


<div class="app">
  <header>
    <div class="brand">VEXBIZ SUMINISTROS</div>
    <div class="counter" id="counter" aria-live="polite">1 de 20</div>
  </header>
  <main id="stage"></main>
  <nav aria-label="Navegación del catálogo">
    <button class="btn-main" id="prev" type="button" aria-label="Página anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Anterior</button>
    <button class="btn-alt" id="home" type="button">Ver índice</button>
    <button class="btn-main" id="next" type="button" aria-label="Página siguiente">Siguiente
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </nav>
  <div class="hint">También puede usar las flechas del teclado o deslizar el dedo.</div>
</div>

<script>
const P = [
 {n:'01',b:'Bray',img:'bray_s20.jpg',t:'Válvula mariposa Serie 20/21',
  d:'Asiento resiliente con disco recubierto. Para servicio sanitario, fluidos levemente corrosivos, otros líquidos y gases. Cierra herméticamente en ambos sentidos.',
  s:[['Tamaños','1" a 20"'],['Cuerpo','Wafer u orejada (lug)'],['Cierre','150 psi'],['Asientos','EPDM, BUNA-N, FKM, PTFE']]},
 {n:'02',b:'Bray',img:'bray_s30.jpg',t:'Válvula mariposa Serie 30/31',
  d:'La más usada en agua potable, aguas residuales y agua de mar. El cuerpo y el vástago no tocan el fluido. Hay versión certificada NSF/ANSI 61 para agua potable.',
  s:[['Tamaños','2" a 20"'],['Cuerpo','Wafer u orejada (lug)'],['Cierre','175 psi'],['Operación','Palanca, volante o actuador']]},
 {n:'03',b:'Bray',img:'bray_s3a.jpg',t:'Válvula mariposa doble brida Serie 3A/3AH',
  d:'Cuerpo completamente bridado y asiento vulcanizado, para líneas de mayor presión: agua, aguas residuales, agua de mar y otros fluidos.',
  s:[['Tamaños','2" a 20"'],['Cuerpo','Doble brida'],['Cierre','250 psi'],['Asientos','BUNA-N, EPDM, FKM']]},
 {n:'04',b:'Bray',img:'bray_mccanna.jpg',t:'Mariposa de alto rendimiento McCannalok',
  d:'Doble excentricidad para alta presión y temperatura. Cierre cero fugas en ambos sentidos. El asiento se cambia en campo quitando pocos pernos.',
  s:[['Tamaños','2" a 66"'],['Clase','ASME 150, 300 y 600'],['Temperatura','−52 °C a 260 °C'],['Cuerpo','Acero al carbono o inoxidable']]},
 {n:'05',b:'Bray',img:'bray_740.jpg',t:'Válvula de cuchilla bidireccional Serie 740',
  d:'Cuerpo de una sola pieza en acero inoxidable con asiento reforzado. Cierra sin fugas en ambos sentidos. Para aguas residuales e industria general.',
  s:[['Tamaños','2" a 36"'],['Cuerpo','Inoxidable 304 o 316'],['Presión','150 psi (2" a 24")'],['Norma','AWWA C520']]},
 {n:'06',b:'Bray',img:'bray_ddcv.jpg',t:'Válvula de retención de doble puerta',
  d:'Tipo wafer, compacta y liviana. Protege las bombas contra el flujo de regreso y ayuda a reducir el golpe de ariete.',
  s:[['Tamaños','2" a 12"'],['Clase','150'],['Cuerpo','Wafer'],['Uso','Descarga de bombas']]},
 {n:'07',b:'Bray',img:'bray_s92.jpg',t:'Actuador neumático Serie 92/93',
  d:'Mueve la válvula con aire comprimido. La Serie 92 es de doble acción y la Serie 93 tiene resorte que cierra la válvula si falta el aire.',
  s:[['Fuerza (torque)','Hasta 44,130 lb-in'],['Aire','40 a 140 psi'],['Material','Aluminio anodizado'],['Seguridad','Apto para SIL 3']]},
 {n:'08',b:'Bray',img:'bray_s76.jpg',t:'Actuador eléctrico Serie 76',
  d:'Mueve la válvula con un motor eléctrico. Trae volante para operarla a mano y muestra la posición aun sin electricidad. Para menos fuerza existe la Serie 70.',
  s:[['Fuerza (torque)','Hasta 79,000 in-lb (9,000 Nm)'],['Electricidad','Monofásica, trifásica o CC'],['Control','Abrir/cerrar o modulante'],['Montaje','ISO 5211']]},
 {n:'09',b:'Ritepro',img:'rite_check.jpg',cover:true,t:'Válvula de retención Check Rite',
  d:'Deja pasar el agua en un solo sentido. Abre por completo con poco caudal, se desgasta menos y cierra sin fugas, con asiento de metal o de goma.',
  s:[['Tamaños','1" a 60"'],['Clase','ASME 125 a 2500'],['Cuerpo','Hierro, acero, inoxidable o titanio'],['Tipo','Swing tipo wafer']]},
 {n:'10',b:'Dorot',img:'dorot_pr.jpg',t:'Válvula reductora de presión S300-PR',
  d:'Baja la presión alta de entrada a una presión de salida fija y estable. Si la presión de salida sube demasiado, cierra herméticamente.',
  s:[['Tamaños','1½" a 32"'],['Presión','PN16 (250 psi) o PN25 (360 psi)'],['Cuerpo','Hierro dúctil revestido'],['Funciona con','La presión de la línea']]},
 {n:'11',b:'Dorot',img:'dorot_ps.jpg',t:'Válvula sostenedora / alivio S300-PS',
  d:'Mantiene una presión mínima estable antes de la válvula. Abre para aliviar cuando la presión sube y cierra cuando baja del valor fijado.',
  s:[['Tamaños','1½" a 32"'],['Presión','PN16 o PN25'],['Cuerpo','Hierro dúctil revestido'],['Uso','Bombeo y redes de agua']]},
 {n:'12',b:'Dorot',img:'dorot_al.jpg',t:'Válvula de altitud S300-AL',
  d:'Controla el nivel de tanques elevados. Un piloto fuera del tanque abre o cierra la válvula según la altura del agua. Nivel máximo y mínimo ajustables.',
  s:[['Tamaños','1½" a 32"'],['Piloto','3 vías'],['Cuerpo','Hierro dúctil revestido'],['Uso','Tanques y reservorios']]},
 {n:'13',b:'Dorot',img:'dorot_fl.jpg',t:'Válvula de flotador S300-FL',
  d:'Mantiene un nivel estable en el tanque con un flotador. Cierra herméticamente cuando el agua llega al nivel fijado. No necesita electricidad.',
  s:[['Tamaños','1½" a 32"'],['Cuerpo','Hierro dúctil revestido'],['Funciona con','La presión de la línea'],['Uso','Llenado de tanques']]},
 {n:'14',b:'Dorot / OCV',img:'dorot_de.jpg',t:'Válvula de diluvio 68-DE/EL',
  d:'Para sistemas contra incendio de diluvio y preacción. Abre por señal eléctrica o por caída de presión de aire, y tiene disparo manual de emergencia.',
  s:[['Presión','Hasta PN25 (375 psi)'],['Certificación','UL Listed'],['Fluido','Agua dulce, salobre, de mar y espuma'],['Uso','Petroquímica y zonas de riesgo']]},
 {n:'15',b:'Dorot / OCV',img:'dorot_hy.jpg',t:'Válvula hidrante HY y HY/PR1',
  d:'Hidrante que abre poco a poco para evitar golpes de presión en la manguera y cierra sin goteo. La versión HY/PR1 además reduce la presión.',
  s:[['Operación','Manual, sin esfuerzo'],['Fluido','Agua, agua de mar y espuma'],['Aprobación','Lloyd’s Register'],['Uso','Plantas, hangares, depósitos']]},
 {n:'16',b:'Dorot / OCV',img:'dorot_mo.jpg',t:'Válvula de monitor MO',
  d:'Alimenta los monitores (cañones) contra incendio. Se abre a mano (MO/M), a distancia (MO/RC) o con electricidad (MO/EL). Cierra poco a poco.',
  s:[['Presión','Hasta PN25 (375 psi)'],['Actuación','Local o remota'],['Fluido','Agua, agua de mar y espuma'],['Uso','Muelles, tanques, plantas']]}
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slides = [];
slides.push(() => `
  <div class="eyebrow">Bray · Ritepro · Dorot</div>
  <h1>Catálogo de Válvulas</h1>
  <p class="lead">Válvulas y actuadores para agua potable, aguas residuales, industria y protección contra incendios.</p>
  <div class="cover-photos">
    <div class="photo"><img src="img/bray_s30.jpg" alt="Válvulas mariposa Bray"></div>
    <div class="photo"><img class="cover" src="img/rite_check.jpg" alt="Válvula de retención Check Rite"></div>
    <div class="photo"><img src="img/dorot_pr.jpg" alt="Válvula reductora Dorot"></div>
  </div>
  <p class="big">Presione <b>Siguiente</b> para avanzar.</p>`);
slides.push(() => `
  <div class="eyebrow">Las marcas</div>
  <h2>¿Quién fabrica estas válvulas?</h2>
  <div class="brands">
    <div><h3>Bray Controls</h3><p>Fabricante de Estados Unidos, con sede en Houston, Texas, desde 1986. Válvulas mariposa, de cuchilla, de retención y actuadores.</p></div>
    <div><h3>Ritepro</h3><p>Empresa del grupo Bray. Especialista en válvulas de retención Check Rite, de 1" hasta 60".</p></div>
    <div><h3>Dorot</h3><p>Fabricante de Israel desde 1946, hoy en el grupo Aquestia. Válvulas automáticas de agua. Su línea contra incendio se vende como OCV.</p></div>
  </div>`);
slides.push(() => `
  <div class="eyebrow">Índice</div>
  <h2>Toque un producto para verlo</h2>
  <div class="toc">${P.map((p,i)=>`<button type="button" data-go="${i+3}"><b>${p.n}</b><span>${esc(p.t)} · ${esc(p.b)}</span></button>`).join('')}</div>`);
P.forEach(p => slides.push(() => `
  <div class="prod">
    <div class="photo"><img ${p.cover?'class="cover" ':''}src="img/${p.img}" alt="${esc(p.t)}"></div>
    <div class="ptext">
      <div class="eyebrow">${esc(p.b)}</div>
      <div class="num">${p.n}</div>
      <h2>${esc(p.t)}</h2>
      <p class="big">${esc(p.d)}</p>
      <dl>${p.s.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    </div>
  </div>`));
slides.push(() => `
  <div class="eyebrow">Pedidos</div>
  <h2>¿Cómo pedir su válvula?</h2>
  <p class="big">Envíenos estos datos y le preparamos la cotización:</p>
  <ol class="steps">
    <li>Modelo o número del catálogo</li>
    <li>Diámetro de la tubería</li>
    <li>Presión y temperatura de trabajo</li>
    <li>Fluido: agua, lodo, agua de mar…</li>
    <li>Conexión: wafer, lug o brida</li>
    <li>Operación: manual, aire o eléctrica</li>
  </ol>
  <p class="big"><b>Vexbiz Suministros</b> · ve.vexbiz.com</p>`);

const stage = document.getElementById('stage'), counter = document.getElementById('counter');
const prev = document.getElementById('prev'), next = document.getElementById('next');
let cur = 0;
function readHash(){ const m = /^#p(\d+)$/.exec(location.hash); return m ? Math.min(Math.max(+m[1]-1,0),slides.length-1) : 0; }
function show(i, push){
  cur = Math.min(Math.max(i,0), slides.length-1);
  stage.innerHTML = `<section class="slide" aria-roledescription="diapositiva">${slides[cur]()}</section>`;
  counter.textContent = `${cur+1} de ${slides.length}`;
  prev.disabled = cur === 0; next.disabled = cur === slides.length-1;
  if (push !== false) { try { history.replaceState(null,'','#p'+(cur+1)); } catch(e){} }
  window.scrollTo({top:0});
}
prev.onclick = () => show(cur-1);
next.onclick = () => show(cur+1);
document.getElementById('home').onclick = () => show(2);
stage.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) show(+b.dataset.go); });
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown') show(cur+1);
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') show(cur-1);
  else if (e.key === 'Home') show(0);
});
let sx = null;
stage.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, {passive:true});
stage.addEventListener('touchend', e => {
  if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 60) show(cur + (dx < 0 ? 1 : -1));
});
window.addEventListener('hashchange', () => show(readHash(), false));
show(readHash(), false);
</script>

</body>
</html>
